name: Silk Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnu-efi qemu-system-x86 ovmf
      - run: sh preboot/tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Silk-Preboot-x64
          path: |
            preboot/build/SilkSplash.efi
            preboot/README.md
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
        env:
          SILK_RENDER_PREVIEW: Silk-desktop.jpg
      - run: go build -trimpath -ldflags="-H windowsgui -s -w" -o Silk.exe .
      - name: Check Windows setup scripts and launch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem setup/*.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors) {throw ($errors -join [Environment]::NewLine)}
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class SilkSmoke {
            [DllImport("user32", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls,string title);
            [DllImport("user32",CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowEx(IntPtr parent,IntPtr after,string cls,string name);
            [DllImport("user32")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32",CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,uint msg,IntPtr w,System.Text.StringBuilder buffer);
            [DllImport("user32")] public static extern bool PostMessage(IntPtr hwnd,uint msg,IntPtr w,IntPtr l);
          }
          '@
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'silk-profile'
          $programs=Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs'
          $null=New-Item -ItemType Directory -Force $programs
          $marker=Join-Path $env:RUNNER_TEMP 'silk-launched.txt'
          $shortcut=(New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $programs 'Silk Finder Fixture.lnk'))
          $shortcut.TargetPath=$env:ComSpec
          $shortcut.Arguments='/d /c echo opened>"'+$marker+'"'
          $shortcut.Save()
          $process = Start-Process .\Silk.exe -PassThru
          try {
            for ($i=0;$i -lt 50;$i++) {
              $bar = [SilkSmoke]::FindWindow('SilkSurface','Silk bar')
              if ($process.HasExited -or $bar -ne [IntPtr]::Zero) {break}
              Start-Sleep -Milliseconds 100
            }
            if ($bar -eq [IntPtr]::Zero) {throw 'Silk bar window missing'}
            $controller=[SilkSmoke]::FindWindow('SilkPrototypeHiddenWindow','Silk')
            $null=[SilkSmoke]::PostMessage($controller,0x312,10,0)
            for ($i=0;$i -lt 80;$i++){
              $finder=[SilkSmoke]::FindWindow('SilkFinder','Silk App Finder')
              $edit=[SilkSmoke]::FindWindowEx($finder,0,'Edit',$null)
              if ($finder -ne [IntPtr]::Zero -and $edit -ne [IntPtr]::Zero -and [SilkSmoke]::IsWindowVisible($finder)){break}
              Start-Sleep -Milliseconds 100
            }
            if ($edit -eq [IntPtr]::Zero -or ![SilkSmoke]::IsWindowVisible($finder)){throw 'Finder did not open'}
            foreach ($letter in 'silk finder fixture'.ToCharArray()) {
              $null=[SilkSmoke]::PostMessage($edit,0x102,[int]$letter,1)
            }
            $value=New-Object Text.StringBuilder 200
            for ($i=0;$i -lt 20;$i++){
              $null=[SilkSmoke]::SendMessage($edit,0xd,200,$value)
              if ($value.ToString() -eq 'silk finder fixture'){break}
              Start-Sleep -Milliseconds 100
            }
            if ($value.ToString() -ne 'silk finder fixture'){throw "Finder did not receive the fixture query: $value"}
            for ($i=0;$i -lt 30;$i++){
              $null=[SilkSmoke]::PostMessage($edit,0x100,13,0)
              Start-Sleep -Milliseconds 250
              if (Test-Path $marker){break}
            }
            if (!(Test-Path $marker)){throw 'Finder failed to launch the matched Start menu shortcut'}
            if (![SilkSmoke]::PostMessage($controller,16,0,0)) {throw 'Could not request exit'}
            if (!$process.WaitForExit(5000) -or $process.ExitCode -ne 0) {throw 'Silk failed to exit cleanly'}
          } finally {if (!$process.HasExited) {$process.Kill()}}
      - uses: actions/upload-artifact@v4
        with:
          name: Silk-Windows-x64
          path: |
            Silk.exe
            assets/midnight-silk.jpg
            setup/
            README.md

      - uses: actions/upload-artifact@v4
        with:
          name: Silk-preview
          path: |
            Silk-desktop.jpg
            Silk-finder.jpg
